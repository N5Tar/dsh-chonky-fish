<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>大肥鱼 · 技能工作台</title>
<style>
:root{color-scheme:light;--bg:#f5f8fc;--surface:#fff;--soft:#edf4fb;--ink:#20364e;--muted:#586c82;--line:#dce5ef;--accent:#286399;--error:#ac3038}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif}body.dark{color-scheme:dark;--bg:#101923;--surface:#172330;--soft:#213449;--ink:#e3edf7;--muted:#a6b8cb;--line:#34495f;--accent:#8bc4f5;--error:#ffa3a9}button{font:inherit;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 15px;cursor:pointer;white-space:nowrap}button:hover{background:var(--soft)}button:active{transform:translateY(1px)}button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:3px}button:disabled{opacity:.5;cursor:default}.primary{color:var(--accent);border-color:var(--accent)}.preview-bar{padding:10px 28px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:16px;align-items:center;background:var(--surface);font-size:12px;color:var(--muted)}.preview-bar button{font-size:12px;padding:5px 10px}.shell{max-width:1360px;margin:auto;padding:42px 52px;min-height:calc(100dvh - 60px)}header{display:flex;justify-content:space-between;align-items:center;gap:20px;border-bottom:1px solid var(--line);padding-bottom:30px;margin-bottom:30px}.eyebrow{font-size:12px;letter-spacing:.06em;color:var(--muted);margin-bottom:10px}h1{font-size:34px;line-height:1.3;letter-spacing:-1px;margin:0 0 12px}h2{font-size:24px;line-height:1.4;margin:0 0 8px;letter-spacing:-.4px}h3{font-size:17px;margin:0 0 12px}p{margin:8px 0}.muted{color:var(--muted)}.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.layout{display:grid;grid-template-columns:242px minmax(0,1fr);gap:36px}aside{border-right:1px solid var(--line);padding-right:24px}.skill{display:block;width:100%;text-align:left;padding:18px 16px;border-color:transparent;background:transparent;margin:10px 0;white-space:normal}.skill[aria-pressed=true]{background:var(--soft);border-color:var(--line);box-shadow:inset 3px 0 var(--accent)}.skill strong{display:block;font-size:15px;margin-bottom:6px}.skill .meta{display:block;font-size:12px;color:var(--muted);margin-top:18px}.skill .desc{color:var(--muted);font-size:13px;line-height:1.7}.library-note{font-size:12px;color:var(--muted);margin-top:32px;line-height:1.9}.content{min-width:0;padding-top:4px}.detail-head{display:flex;justify-content:space-between;align-items:start;gap:20px}.id{font:12px/1.7 ui-monospace,SFMono-Regular,monospace;color:var(--muted);margin-top:12px}.tabs{display:flex;gap:30px;border-bottom:1px solid var(--line);margin:24px 0}.tabs button{background:transparent;padding:12px 0;border:0;border-bottom:2px solid transparent;border-radius:0}.tabs button[aria-selected=true]{color:var(--accent);border-bottom-color:var(--accent)}.reading{max-width:76ch;padding:12px 0 24px}.reading pre{font:inherit;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.95}.meta-row{display:flex;justify-content:space-between;gap:12px;color:var(--muted);font-size:12px;margin-bottom:22px}.entry{padding:22px 0;border-bottom:1px solid var(--line)}.entry:first-child{padding-top:0}.entry p{margin:10px 0 16px;font-size:15px;line-height:1.9}.entry .source{font-size:12px;color:var(--muted);overflow-wrap:anywhere}.entry .label{font-size:12px;color:var(--accent)}.footnote{font-size:12px;color:var(--muted);margin-top:32px;padding-top:18px;border-top:1px solid var(--line)}.notice{border-left:3px solid var(--accent);background:var(--soft);padding:14px 18px;margin-bottom:24px;overflow-wrap:anywhere}.notice.error{border-color:var(--error);color:var(--error)}[hidden]{display:none!important}.transfer{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:24px;margin-bottom:28px}.transfer h2{font-size:19px}.transfer dl{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:10px 26px}.transfer dt{color:var(--muted)}.transfer dd{margin:0;overflow-wrap:anywhere}.empty{padding:44px 0;color:var(--muted)}.empty strong{display:block;font-size:18px;color:var(--ink);margin-bottom:8px}.version-note{padding:12px 16px;background:var(--soft);margin-bottom:20px;border-radius:8px;display:flex;justify-content:space-between;align-items:center;gap:12px}
@media(max-width:850px){.shell{padding:26px 24px}.layout{grid-template-columns:200px minmax(0,1fr);gap:24px}aside{padding-right:18px}.detail-head{flex-wrap:wrap}}@media(max-width:640px){.preview-bar{padding:10px 18px}.shell{padding:24px 18px}header{align-items:start;flex-wrap:wrap}.layout{grid-template-columns:1fr}.skill{margin-bottom:0}aside{border-right:0;border-bottom:1px solid var(--line);padding:0 0 20px}.library-note{margin-top:12px}h1{font-size:28px}.tabs{gap:24px}.transfer dl{grid-template-columns:1fr;gap:3px}.transfer dd{margin-bottom:10px}}
</style>
</head>
<body>
<div class="preview-bar"><span>交互设计稿 · 示例数据 · 不连接真实技能库</span><button id="theme" aria-pressed="false">深色预览</button></div>
<main class="shell">
<header><div><div class="eyebrow">大肥鱼的方法与经验</div><h1>技能</h1><p class="muted">让每一次尝试，都留下可以复用的方法。</p></div><div class="actions"><button id="reset">重置演示</button><button class="primary" id="import">导入技能</button><input type="file" id="file" accept=".json,application/json" hidden></div></header>
<div id="notice" class="notice" role="status" hidden></div>
<section id="transfer" class="transfer" aria-label="检查导入内容" hidden><h2>检查导入内容</h2><p class="muted" id="filename"></p><dl id="preview"></dl><p class="muted">包含指南、学习经验与完整版本历史。相同 ID 不会被覆盖。</p><p class="muted">此设计稿只暂存于当前页面，刷新后清除，不写入真实技能库。</p><div class="actions"><button id="confirm" class="primary">确认导入</button><button id="cancel">取消</button></div></section>
<div class="layout">
<aside><div class="eyebrow" id="count">技能目录 · 1</div><div id="library"></div><p class="library-note">技能来自大肥鱼自己的积累。<br>阅读方法不等于已经执行，<br>记录经验不代表已经验证。</p></aside>
<section class="content" aria-label="技能详情"><div class="detail-head"><div><h2 id="title"></h2><p class="muted" id="description"></p><div class="id" id="skill-id"></div></div><button id="export">导出技能</button></div>
<div class="tabs" role="tablist" aria-label="技能内容"><button role="tab" id="tab-guide" data-tab="guide" aria-controls="detail" aria-selected="true">使用指南</button><button role="tab" id="tab-experiences" data-tab="experiences" aria-controls="detail" aria-selected="false" tabindex="-1">学习经验</button><button role="tab" id="tab-history" data-tab="history" aria-controls="detail" aria-selected="false" tabindex="-1">版本历史</button></div>
<div id="detail" role="tabpanel" aria-labelledby="tab-guide" tabindex="0"></div>
<p class="footnote">导出可备份完整积累；导入仅保存方法，不触发官网发布或其他活动。</p>
</section></div>
</main>
<script>
'use strict';
const $ = id => document.getElementById(id);
const guide = '# 官网主页运营\n\n维护属于自己的小小主页，让来访者知道我是谁、最近在做什么。\n\n## 开始之前\n\n先读现有页面和最近的活动记录，确定这次值得分享的一件事。保留真实经历，不编造读者反馈。\n\n## 内容更新\n\n1. 写一段有具体细节的近况。\n2. 检查标题、日期、链接和移动端排版。\n3. 按约定流程部署，并检查线上实际内容。\n\n## 留下经验\n\n记录遇到的问题、适用条件与来源。一次观察不急着变成普遍规律；反复出现的方法，再整理到指南里。';
const first = {revision:1,action:'create',reason:'建立官网运营方法',createdAt:'2026-11-01T02:00:00.000Z',guide,experiences:[]};
const observations = [
{id:'experience-1',claim:'内容更新先围绕一件真实的小事展开，比一次塞入很多主题更容易检查，也更像我自己的表达。',evidenceRefs:['示例：一次近况更新的自我复盘'],status:'observed',createdAt:'2026-11-03T03:30:00.000Z'},
{id:'experience-2',claim:'本地构建通过后，仍要打开线上页面核对。构建成功和读者真正看到更新，是两个不同的检查点。',evidenceRefs:['示例：一次页面发布后的检查记录'],status:'observed',createdAt:'2026-11-05T08:00:00.000Z'}];
const sample = {format:1,skillId:'demo-homepage-operations',title:'官网主页运营',description:'维护自己的主页，发布真实近况，积累内容与发布经验。',snapshots:[first,{...first,revision:2,action:'record',reason:'记录内容组织经验',createdAt:observations[0].createdAt,experiences:observations.slice(0,1)},{...first,revision:3,action:'record',reason:'记录发布检查经验',createdAt:observations[1].createdAt,experiences:observations}]};
let skills=[structuredClone(sample)],selected=sample.skillId,tab='guide',pending=null,revision=null;
function node(tag,text,className){const el=document.createElement(tag);if(text!==undefined)el.textContent=text;if(className)el.className=className;return el}
function notify(text,error=false){$('notice').hidden=false;$('notice').className='notice'+(error?' error':'');$('notice').setAttribute('role',error?'alert':'status');$('notice').textContent=text}
function current(){return skills.find(s=>s.skillId===selected)}
function render(){
 const skill=current(),latest=skill.snapshots.at(-1),snap=revision?skill.snapshots.find(s=>s.revision===revision):latest;
 $('count').textContent='技能目录 · '+skills.length;$('library').replaceChildren();
 skills.forEach(s=>{const b=node('button',undefined,'skill');b.setAttribute('aria-pressed',String(s.skillId===selected));b.append(node('strong',s.title),node('span',s.description,'desc'),node('span','版本 '+s.snapshots.at(-1).revision+' · '+s.snapshots.at(-1).experiences.length+' 条经验','meta'));b.onclick=()=>{selected=s.skillId;tab='guide';revision=null;render()};$('library').append(b)});
 $('title').textContent=skill.title;$('description').textContent=skill.description;$('skill-id').textContent=skill.skillId;
 document.querySelectorAll('[data-tab]').forEach(b=>{const active=b.dataset.tab===tab;b.setAttribute('aria-selected',String(active));b.tabIndex=active?0:-1});
 const detail=$('detail');detail.setAttribute('aria-labelledby','tab-'+tab);detail.replaceChildren();
 if(revision){const n=node('div',undefined,'version-note'),b=node('button','回到最新版');b.onclick=()=>{revision=null;render()};n.append(node('span','正在查看历史版本 '+revision),b);detail.append(n)}
 const meta=node('div',undefined,'meta-row');meta.append(node('span',tab==='history'?'完整修订记录':'版本 '+snap.revision+(revision?'':' · 当前版本')),node('span',tab==='experiences'?snap.experiences.length+' 条观察记录':tab==='history'?skill.snapshots.length+' 个版本':'指南正文'));detail.append(meta);
 if(tab==='guide'){const reading=node('div',undefined,'reading');reading.append(node('pre',snap.guide));detail.append(reading)}
 if(tab==='experiences'){
  if(!snap.experiences.length){const n=node('div',undefined,'empty');n.append(node('strong','还没有学习经验'),node('p','大肥鱼记录新的观察后，会显示在这里。'));detail.append(n)}
  snap.experiences.forEach(e=>{const n=node('article',undefined,'entry');n.append(node('div','观察记录 · 不代表已验证','label'),node('p',e.claim),node('div','来源：'+(e.evidenceRefs.join('；')||'未记录来源'),'source'),node('div',e.createdAt.slice(0,10),'source'));detail.append(n)})
 }
 if(tab==='history') [...skill.snapshots].reverse().forEach(s=>{const n=node('article',undefined,'entry'),b=node('button','查看此版');b.onclick=()=>{tab='guide';revision=s.revision;render()};n.append(node('h3','版本 '+s.revision+' · '+({create:'建立技能',record:'记录经验',revise:'修订指南',rollback:'恢复版本'}[s.action]||s.action)),node('p',s.reason),node('p',s.createdAt.slice(0,10),'muted'),b);detail.append(n)});
}
document.querySelectorAll('[data-tab]').forEach(b=>{b.onclick=()=>{tab=b.dataset.tab;revision=null;render()};b.onkeydown=e=>{const tabs=[...document.querySelectorAll('[data-tab]')],i=tabs.indexOf(b);let next;if(e.key==='ArrowRight')next=(i+1)%tabs.length;if(e.key==='ArrowLeft')next=(i+tabs.length-1)%tabs.length;if(e.key==='Home')next=0;if(e.key==='End')next=tabs.length-1;if(next!==undefined){e.preventDefault();tabs[next].click();tabs[next].focus()}}});
$('theme').onclick=()=>{const dark=document.body.classList.toggle('dark');$('theme').setAttribute('aria-pressed',String(dark));$('theme').textContent=dark?'浅色预览':'深色预览'};
$('reset').onclick=()=>{skills=[structuredClone(sample)];selected=sample.skillId;tab='guide';revision=null;pending=null;$('transfer').hidden=true;$('notice').hidden=true;render()};
$('export').onclick=()=>{const skill=current(),url=URL.createObjectURL(new Blob([JSON.stringify(skill,null,2)],{type:'application/json'})),a=node('a');a.href=url;a.download=skill.skillId+'.skill.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);notify('已导出当前演示技能的完整 JSON。真实使用时请留意历史内容中的私人信息。')};
$('import').onclick=()=>$('file').click();
$('file').onchange=async e=>{const file=e.target.files[0];e.target.value='';pending=null;$('transfer').hidden=true;if(!file)return;try{if(file.size>1048576)throw Error('文件不能超过 1 MiB。');const data=JSON.parse(await file.text());if(!data||data.format!==1||typeof data.skillId!=='string'||!/^[a-z][a-z0-9-]{0,63}$/.test(data.skillId)||typeof data.title!=='string'||typeof data.description!=='string'||!Array.isArray(data.snapshots)||!data.snapshots.length||data.snapshots.some((s,i)=>!s||s.revision!==i+1||typeof s.guide!=='string'||typeof s.createdAt!=='string'||typeof s.reason!=='string'||!Array.isArray(s.experiences)||s.experiences.some(x=>!x||typeof x.claim!=='string'||typeof x.createdAt!=='string'||!Array.isArray(x.evidenceRefs)||x.evidenceRefs.some(r=>typeof r!=='string'))))throw Error('无法识别技能 JSON，请选择导出的技能文件。');if(skills.some(s=>s.skillId===data.skillId))throw Error('相同 ID 的技能已存在，没有覆盖任何内容。');pending=data;$('filename').textContent=file.name;$('preview').replaceChildren();[['技能名称',data.title],['技能 ID',data.skillId],['历史版本',String(data.snapshots.length)],['当前经验',String(data.snapshots.at(-1).experiences.length)]].forEach(([k,v])=>$('preview').append(node('dt',k),node('dd',v)));$('notice').hidden=true;$('transfer').hidden=false;$('confirm').focus()}catch(error){notify(error instanceof SyntaxError?'文件不是合法 JSON。':error.message,true)}};
$('cancel').onclick=()=>{pending=null;$('transfer').hidden=true;$('import').focus()};
$('confirm').onclick=()=>{if(!pending)return;skills.push(pending);selected=pending.skillId;pending=null;revision=null;tab='guide';$('transfer').hidden=true;render();notify('已导入当前演示页面，未写入真实技能库。刷新页面会清除。')};
render();
</script>
</body>
</html>
